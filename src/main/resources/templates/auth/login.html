<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Learning Hub</title>
    <meta name="description" content="Chào mừng bạn quay trở lại với Learning Hub. Đăng nhập để tiếp tục hành trình học tập các khóa học kỹ năng thực tiễn của bạn.">
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Login Page Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-light-blue d-flex flex-column min-vh-100">

    <!-- Header Navigation -->
    <header class="navbar navbar-expand-lg bg-white border-bottom py-3">
        <div class="container px-3 d-flex justify-content-between align-items-center">
            
            <!-- Logo Section -->
            <a class="navbar-brand d-flex align-items-center gap-2 m-0" th:href="@{/}">
                <div class="logo-icon-box d-flex align-items-center justify-content-center bg-primary rounded text-white" style="width: 32px; height: 32px;">
                    <i data-lucide="zap" style="width: 18px; height: 18px; fill: currentColor;"></i>
                </div>
                <span class="logo-text fw-bold text-primary font-heading fs-5">LEARNING HUB</span>
            </a>

            <!-- Right link -->
            <div class="header-link">
                <a href="#" class="text-muted fs-7 fw-medium text-decoration-none hover-primary-link" id="header-register-btn">
                    Đăng ký / Đăng nhập
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container (Vertically Centered Login Form) -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
        <div class="card border-0 rounded-4 shadow-lg p-5 login-card" style="width: 100%; max-width: 480px;">
            
            <!-- Form Area (Login State by default) -->
            <div id="login-form-wrapper">
                <h1 class="card-title fw-bold text-dark font-heading text-center mb-1 fs-3">Chào Mừng Bạn Quay Lại</h1>
                <p class="text-muted text-center fs-7 mb-4">Đăng nhập vào Learning Hub</p>
                
                <form id="login-form">
                    <!-- Email input wrapper -->
                    <div class="input-wrapper position-relative mb-3">
                        <i data-lucide="mail" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                        <input type="email" placeholder="Email" class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7" value="tongtien031120@gmail.com" required id="login-email">
                    </div>

                    <!-- Password input wrapper -->
                    <div class="input-wrapper position-relative mb-3">
                        <i data-lucide="lock" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                        <input type="password" placeholder="Mật khẩu" class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7" value="password123" required id="login-password">
                    </div>

                    <!-- Remember password checkbox -->
                    <div class="form-check mb-4 text-start">
                        <input class="form-check-input shadow-none border-secondary-subtle" type="checkbox" id="rememberPassword" checked>
                        <label class="form-check-label text-muted fs-7 select-none" for="rememberPassword">
                            Nhớ mật khẩu
                        </label>
                    </div>

                    <!-- Sign in CTA -->
                    <button class="btn btn-primary w-100 py-2.5 fw-bold fs-7 rounded-3 mb-3 btn-login" type="submit">
                        Đăng Nhập
                    </button>

                    <!-- Google Sign in CTA -->
                    <button class="btn btn-danger w-100 py-2.5 fw-bold fs-7 rounded-3 d-flex align-items-center justify-content-center gap-2 mb-4 btn-google" type="button" id="btn-login-google">
                        <i data-lucide="chrome" style="width:16px; height:16px; fill: currentColor;"></i>
                        <span>Đăng Nhập Bằng Google</span>
                    </button>

                    <!-- Register link -->
                    <div class="text-center fs-7 mb-2 text-muted">
                        Bạn chưa có tài khoản? <a href="#" class="text-primary fw-semibold text-decoration-none" id="btn-switch-to-register">Đăng Ký Ngay</a>
                    </div>

                    <!-- Forgot password link -->
                    <div class="text-center">
                        <a href="#" class="text-muted fs-7 text-decoration-none hover-primary-link" id="btn-forgot-password">Quên mật khẩu</a>
                    </div>
                </form>
            </div>

            <!-- Form Area (Register State, toggled in JS) -->
            <div id="register-form-wrapper" style="display: none;">
                <h1 class="card-title fw-bold text-dark font-heading text-center mb-1 fs-3">Đăng Ký Tài Khoản</h1>
                <p class="text-muted text-center fs-7 mb-4">Tham gia học tập cùng Learning Hub</p>
                
                <form id="register-form">
                    <!-- Fullname input -->
                    <div class="input-wrapper position-relative mb-3">
                        <i data-lucide="user" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                        <input type="text" placeholder="Họ và tên" class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7" required id="reg-name">
                    </div>

                    <!-- Email input -->
                    <div class="input-wrapper position-relative mb-3">
                        <i data-lucide="mail" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                        <input type="email" placeholder="Email đăng ký" class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7" required id="reg-email">
                    </div>

                    <!-- Password input -->
                    <div class="input-wrapper position-relative mb-3">
                        <i data-lucide="lock" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                        <input type="password" placeholder="Mật khẩu" class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7" required id="reg-password">
                    </div>

                    <!-- Password confirmation input -->
                    <div class="input-wrapper position-relative mb-4">
                        <i data-lucide="check-square" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                        <input type="password" placeholder="Xác nhận mật khẩu" class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7" required id="reg-password-confirm">
                    </div>

                    <!-- Register CTA -->
                    <button class="btn btn-primary w-100 py-2.5 fw-bold fs-7 rounded-3 mb-3 btn-login" type="submit">
                        Đăng Ký
                    </button>

                    <!-- Login Switche link -->
                    <div class="text-center fs-7 text-muted">
                        Đã có tài khoản? <a href="#" class="text-primary fw-semibold text-decoration-none" id="btn-switch-to-login">Đăng Nhập Ngay</a>
                    </div>
                </form>
            </div>
            
        </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="footer py-3 text-center border-top bg-white">
        <p class="text-muted fs-8 m-0">© 2023 Learning Hub. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Custom JavaScript -->
    <script th:src="@{/js/login.js}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
