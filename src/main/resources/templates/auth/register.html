<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Learning Hub</title>
    <meta name="description" content="Tạo tài khoản Learning Hub miễn phí và bắt đầu hành trình học tập các khóa học kỹ năng thực tiễn ngay hôm nay.">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Auth Page Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-light-blue d-flex flex-column min-vh-100">

    <!-- Header Navigation -->
    <header class="navbar navbar-expand-lg bg-white border-bottom py-3">
        <div class="container px-3 d-flex justify-content-between align-items-center">

            <!-- Logo Section -->
            <a class="navbar-brand d-flex align-items-center gap-2 m-0" th:href="@{/}">
                <div class="logo-icon-box d-flex align-items-center justify-content-center bg-primary rounded text-white" style="width: 32px; height: 32px;">
                    <i data-lucide="zap" style="width: 18px; height: 18px; fill: currentColor;"></i>
                </div>
                <span class="logo-text fw-bold text-primary font-heading fs-5">LEARNING HUB</span>
            </a>

            <!-- Right link -->
            <div class="header-link">
                <a th:href="@{/auth/login}" href="login.html" class="text-muted fs-7 fw-medium text-decoration-none hover-primary-link" id="header-login-btn">
                    Đã có tài khoản? Đăng nhập
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container (Vertically Centered Register Form) -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 px-3">
        <div class="card border-0 rounded-4 shadow-lg p-5 login-card" style="width: 100%; max-width: 480px;">

            <!-- Page Title -->
            <h1 class="card-title fw-bold text-dark font-heading text-center mb-1 fs-3">Tạo Tài Khoản Mới</h1>
            <p class="text-muted text-center fs-7 mb-4">Tham gia học tập cùng Learning Hub</p>

            <!-- Register Form -->
            <form id="register-form" th:action="@{/auth/register}" method="post">

                <!-- CSRF token is present only when Spring Security CSRF is enabled -->
                <th:block th:if="${_csrf != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </th:block>

                <!-- Fullname input -->
                <div class="input-wrapper position-relative mb-3">
                    <i data-lucide="user" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                    <input type="text"
                           name="fullName"
                           placeholder="Họ và tên"
                           class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7"
                           required
                           id="reg-fullname"
                           autocomplete="name">
                </div>

                <!-- Email input -->
                <div class="input-wrapper position-relative mb-3">
                    <i data-lucide="mail" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                    <input type="email"
                           name="email"
                           placeholder="Email đăng ký"
                           class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7"
                           required
                           id="reg-email"
                           autocomplete="email">
                </div>

                <!-- Phone input -->
                <div class="input-wrapper position-relative mb-3">
                    <i data-lucide="phone" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                    <input type="tel"
                           name="phone"
                           placeholder="Số điện thoại (tuỳ chọn)"
                           class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7"
                           id="reg-phone"
                           autocomplete="tel">
                </div>

                <!-- Password input -->
                <div class="input-wrapper position-relative mb-3">
                    <i data-lucide="lock" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                    <input type="password"
                           name="password"
                           placeholder="Mật khẩu (tối thiểu 8 ký tự)"
                           class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7"
                           required
                           id="reg-password"
                           minlength="8"
                           autocomplete="new-password">
                </div>

                <!-- Password confirmation input -->
                <div class="input-wrapper position-relative mb-4">
                    <i data-lucide="check-square" class="input-prefix-icon text-muted position-absolute start-0 top-50 translate-middle-y ms-3" style="width:16px; height:16px;"></i>
                    <input type="password"
                           name="confirmPassword"
                           placeholder="Xác nhận mật khẩu"
                           class="form-control rounded-3 border-0 bg-light py-2 ps-5 fs-7"
                           required
                           id="reg-password-confirm"
                           autocomplete="new-password">
                </div>

                <!-- Password mismatch error (hidden by default) -->
                <div id="password-error" class="alert alert-danger py-2 fs-7 mb-3" style="display: none;" role="alert">
                    <i data-lucide="alert-circle" style="width:14px; height:14px;"></i>
                    Mật khẩu xác nhận không khớp.
                </div>

                <!-- Terms checkbox -->
                <div class="form-check mb-4 text-start">
                    <input class="form-check-input shadow-none border-secondary-subtle" type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label class="form-check-label text-muted fs-7 select-none" for="agreeTerms">
                        Tôi đồng ý với <a href="#" class="text-primary text-decoration-none fw-semibold">Điều khoản dịch vụ</a>
                        và <a href="#" class="text-primary text-decoration-none fw-semibold">Chính sách bảo mật</a>
                    </label>
                </div>

                <!-- Register CTA -->
                <button class="btn btn-primary w-100 py-2.5 fw-bold fs-7 rounded-3 mb-3 btn-login" type="submit" id="btn-register-submit">
                    Tạo Tài Khoản
                </button>

                <!-- Google Sign Up CTA -->
                <button class="btn btn-danger w-100 py-2.5 fw-bold fs-7 rounded-3 d-flex align-items-center justify-content-center gap-2 mb-4 btn-google" type="button" id="btn-register-google">
                    <i data-lucide="chrome" style="width:16px; height:16px; fill: currentColor;"></i>
                    <span>Đăng Ký Bằng Google</span>
                </button>

                <!-- Login redirect link -->
                <div class="text-center fs-7 text-muted">
                    Đã có tài khoản?
                    <a th:href="@{/auth/login}" href="login.html" class="text-primary fw-semibold text-decoration-none" id="btn-go-to-login">Đăng Nhập Ngay</a>
                </div>

            </form>

        </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="footer py-3 text-center border-top bg-white">
        <p class="text-muted fs-8 m-0">© 2025 Learning Hub. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Lucide Icons Init -->
    <script>lucide.createIcons();</script>

    <!-- Register Page JS -->
    <script>
        // Password confirmation validation
        const form = document.getElementById('register-form');
        const password = document.getElementById('reg-password');
        const confirmPassword = document.getElementById('reg-password-confirm');
        const errorBox = document.getElementById('password-error');

        form.addEventListener('submit', function (e) {
            if (password.value !== confirmPassword.value) {
                e.preventDefault();
                errorBox.style.display = 'flex';
                errorBox.style.alignItems = 'center';
                errorBox.style.gap = '6px';
                confirmPassword.classList.add('is-invalid');
            } else {
                errorBox.style.display = 'none';
                confirmPassword.classList.remove('is-invalid');
            }
        });

        confirmPassword.addEventListener('input', function () {
            if (password.value === confirmPassword.value) {
                errorBox.style.display = 'none';
                confirmPassword.classList.remove('is-invalid');
            }
        });
    </script>

</body>
</html>
