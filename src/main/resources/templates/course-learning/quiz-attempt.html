<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm bài test</title>
    <link rel="stylesheet" th:href="@{/css/learner/quiz.css}">
    <link rel="stylesheet" th:href="@{/css/common/bootstrap.css}">
</head>
<body>
    <div class="quiz-container">
        <!-- Quiz Header -->
        <header class="quiz-header">
            <h1 id="quizTitle">Bài test: Kiểm tra kiến thức</h1>
            <div class="quiz-timer">
                <span class="timer-label">Thời gian còn lại:</span>
                <span class="timer-value" id="timer">60:00</span>
            </div>
            <div class="quiz-progress">
                <span id="questionCounter">Câu 1 / 10</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 10%;"></div>
                </div>
            </div>
        </header>

        <!-- Quiz Content -->
        <main class="quiz-content">
            <section class="question-section">
                <h2 id="questionText">Câu hỏi 1: ...?</h2>
                <form class="answer-form">
                    <!-- Multiple Choice Questions -->
                    <div class="question-type-mc">
                        <div class="answer-option">
                            <input type="radio" id="option-a" name="answer" value="A">
                            <label for="option-a" class="option-label">A) Đáp án A</label>
                        </div>
                        <div class="answer-option">
                            <input type="radio" id="option-b" name="answer" value="B">
                            <label for="option-b" class="option-label">B) Đáp án B</label>
                        </div>
                        <div class="answer-option">
                            <input type="radio" id="option-c" name="answer" value="C">
                            <label for="option-c" class="option-label">C) Đáp án C</label>
                        </div>
                        <div class="answer-option">
                            <input type="radio" id="option-d" name="answer" value="D">
                            <label for="option-d" class="option-label">D) Đáp án D</label>
                        </div>
                    </div>

                    <!-- Question Navigation -->
                    <div class="quiz-buttons">
                        <button type="button" class="btn-secondary" id="prevBtn">← Câu trước</button>
                        <button type="button" class="btn-primary" id="nextBtn">Câu tiếp theo →</button>
                    </div>
                </form>
            </section>

            <!-- Question Review Panel (Optional) -->
            <aside class="quiz-review-panel">
                <h3>Danh sách câu hỏi</h3>
                <div class="question-grid" id="questionGrid">
                    <!-- Question buttons will be dynamically generated -->
                    <button class="question-btn active" data-question="1">1</button>
                    <button class="question-btn" data-question="2">2</button>
                    <button class="question-btn" data-question="3">3</button>
                    <button class="question-btn skipped" data-question="4">4</button>
                </div>
            </aside>
        </main>

        <!-- Quiz Footer -->
        <footer class="quiz-footer">
            <button type="button" class="btn-secondary" id="pauseBtn">Tạm dừng</button>
            <button type="button" class="btn-danger" id="submitBtn">Nộp bài</button>
        </footer>
    </div>

    <!-- Confirmation Modal -->
    <div id="submitModal" class="modal hidden">
        <div class="modal-content">
            <h2>Xác nhận nộp bài</h2>
            <p>Bạn có chắc chắn muốn nộp bài không? Hành động này không thể hoàn tác.</p>
            <div class="modal-buttons">
                <button class="btn-secondary" id="cancelSubmit">Hủy</button>
                <button class="btn-danger" id="confirmSubmit">Nộp bài</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/learner/quiz-engine.js}"></script>
</body>
</html>
