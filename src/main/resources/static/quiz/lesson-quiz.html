<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu hỏi ôn tập</title>
    <meta name="description" content="Trang câu hỏi ôn tập cho bài học Learning Hub.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2RjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/quiz.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="quiz-page-body bg-light">
    <main class="quiz-page container-fluid py-4 py-lg-5">
        <div class="quiz-page-header mb-4">
            <div class="d-flex align-items-center gap-2 mb-2">
                <i data-lucide="help-circle" class="text-primary" style="width: 22px; height: 22px;"></i>
                <h1 class="quiz-page-title m-0 fw-bold font-heading">Câu hỏi ôn tập</h1>
            </div>
            <p class="text-muted fs-7 mb-0">Trang này đã được tách riêng để nhúng vào bài học bằng iframe.</p>
        </div>

        <section class="quiz-list d-flex flex-column gap-4">
            <article class="card border border-light-subtle rounded-4 p-4 bg-white shadow-sm quiz-question-box">
                <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
                    <div>
                        <p class="quiz-question-number text-primary fw-semibold mb-1">Câu 1</p>
                        <h2 class="quiz-question-title fw-bold fs-6 text-dark mb-0">Pickup trên guitar điện có chức năng chính là gì?</h2>
                    </div>
                    <span class="badge rounded-pill text-bg-primary-subtle text-primary fw-semibold">1 điểm</span>
                </div>

                <div class="d-flex flex-column gap-2.5">
                    <div class="d-flex align-items-center gap-3 p-3 border rounded-3 quiz-option active-option">
                        <span class="fs-7 text-muted-dark fw-semibold">A</span>
                        <span class="fs-7 text-muted-dark">Chuyển đổi rung động của dây thành tín hiệu điện</span>
                    </div>
                    <div class="d-flex align-items-center gap-3 p-3 border rounded-3 quiz-option">
                        <span class="fs-7 text-muted-dark fw-semibold">B</span>
                        <span class="fs-7 text-muted-dark">Làm dây guitar rung mạnh hơn</span>
                    </div>
                    <div class="d-flex align-items-center gap-3 p-3 border rounded-3 quiz-option">
                        <span class="fs-7 text-muted-dark fw-semibold">C</span>
                        <span class="fs-7 text-muted-dark">Điều chỉnh độ cao của dây guitar</span>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lH60NNkmXc5s9fDVZLESZk6A55NDzOxhy9GkcIdslK1N7N6jIeHz"
            crossorigin="anonymous"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
